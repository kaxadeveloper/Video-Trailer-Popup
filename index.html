<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Trailer Popup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">
        <img src="https://images.pexels.com/photos/109669/pexels-photo-109669.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2"
            alt="movie-image">
        <h1>Movie Title</h1>
        <p>
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Reprehenderit, dolores explicabo nobis commodi nemo
            voluptatum ab. Sunt id ipsum ullam laudantium, cumque ipsam, quo, eligendi repellendus expedita fugiat iure
            odit!
        </p>

        <button class="btn">Watch Now</button>
    </div>

    <div class="trailer-container active">
        <video src="img/trailer.mp4" controls></video>
        <i class="fa-solid fa-circle-xmark fa-2x close-icon"></i>
    </div>

    <script src="app.js"></script>
</body>

</html>
